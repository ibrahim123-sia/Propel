# Weekly dependency updates, grouped so they arrive as a few pull requests. CI must pass
# before any of them is merged; major versions are reviewed by hand.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # v9 is a rewrite of the table API every admin list uses: migrate on purpose, not by PR.
      - dependency-name: "@tanstack/react-table"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
